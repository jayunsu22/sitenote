<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>시공 전 확인</title>
  <!-- 📋 업체 확인 질문폼 (2026-11-13 사장님: 업체 답이 너무 다양해 앱에 잘 안 들어간다 → 보기에서 고르기만).
       카톡·문자로 간 링크(ask.html#열쇠)를 업체가 연다. 열쇠 = 그 현장 전용 무작위 글자 (앱이 '묻기' 를 켤 때 만듦).
       n8n 현장관리_빈칸 ask-form 이 질문을 주고(GET) 답을 받아(POST) 현장관리 앱 칸에 넣는다. 로그인·설치 없음 -->
  <style>
    :root { --bg: #f4f5f7; --card: #fff; --text: #111827; --muted: #5b6472; --border: #e2e5ea; --primary: #2563eb; --primary-soft: #e6eefc; --ok: #15803d; --bad: #b91c1c; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif; font-size: 16px; line-height: 1.5; }
    .head { background: #1e293b; color: #fff; padding: 18px 16px 14px; }
    .head small { display: block; color: #cbd5e1; font-size: 13px; }
    .head h1 { margin: 2px 0 0; font-size: 19px; }
    .head .meta { font-size: 14px; color: #e2e8f0; }
    .prog { height: 5px; background: #334155; border-radius: 9px; margin-top: 12px; overflow: hidden; }
    .prog i { display: block; height: 100%; width: 0; background: #60a5fa; transition: width .2s; }
    main { padding: 12px 12px 110px; max-width: 560px; margin: 0 auto; }
    .q { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 13px 13px 12px; margin-bottom: 10px; }
    .q.done { border-color: #a7d9b6; }
    .qt { font-weight: 700; margin-bottom: 9px; }
    .qt span { color: var(--muted); font-weight: 500; margin-right: 5px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { min-height: 44px; padding: 0 15px; border: 1.5px solid var(--border); border-radius: 999px; background: #fff; color: var(--text); font: inherit; font-size: 15px; }
    .chip.on { border-color: var(--primary); background: var(--primary-soft); color: #1d4ed8; font-weight: 700; }
    .chip.etc { border-style: dashed; color: var(--muted); }
    input.box, textarea.box { width: 100%; border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 16px; margin-top: 8px; background: #fff; }
    input.box:focus, textarea.box:focus { outline: none; border-color: var(--primary); }
    .pw { margin: 0 0 8px; letter-spacing: 1px; }
    .sent { font-size: 13px; color: var(--ok); margin-top: 6px; }
    .bar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--border); padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
    .bar button { display: block; width: 100%; max-width: 560px; margin: 0 auto; min-height: 50px; border: 0; border-radius: 12px; background: var(--primary); color: #fff; font: inherit; font-size: 17px; font-weight: 700; }
    .bar button:disabled { background: #9db8f2; }
    .bar small { display: block; text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 5px; }
    .msg { text-align: center; padding: 60px 24px; }
    .msg .big { font-size: 46px; }
    .msg h2 { margin: 8px 0 6px; font-size: 21px; }
    .msg p { color: var(--muted); margin: 0 0 18px; }
    .sum { text-align: left; background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; max-width: 420px; margin: 0 auto; }
    .sum div { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px dashed var(--border); font-size: 15px; }
    .sum div:last-child { border: 0; }
    .sum span { color: var(--muted); }
    .again { margin-top: 18px; min-height: 44px; padding: 0 18px; border: 1.5px solid var(--border); border-radius: 12px; background: #fff; font: inherit; }
  </style>
</head>
<body>
  <div id="app"><div class="msg"><p>불러오는 중…</p></div></div>
  <script>
  (function () {
    var API = 'https://primary-production-a6fa.up.railway.app/webhook/ask-form';
    var key = String(location.hash || '').replace(/^#/, '').trim();
    var app = document.getElementById('app');
    var data = null, ans = {};
    function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
    function msg(big, title, sub) {
      app.innerHTML = '';
      var m = el('div', 'msg'); m.appendChild(el('div', 'big', big)); m.appendChild(el('h2', '', title)); if (sub) m.appendChild(el('p', '', sub));
      app.appendChild(m); return m;
    }
    if (!/^[a-z0-9]{12,40}$/.test(key)) { msg('🔗', '주소가 잘못됐어요', '카톡으로 받은 링크를 그대로 눌러 주세요'); return; }
    function answered() { return data.items.filter(function (q) { return String(ans[q.id] || '').trim(); }).length; }
    function render() {
      app.innerHTML = '';
      var head = el('div', 'head');
      head.appendChild(el('small', '', (data.company || '시공팀') + ' · 시공 전 확인'));
      head.appendChild(el('h1', '', data.site.title));
      head.appendChild(el('div', 'meta', data.site.date + ' 시공'));
      var prog = el('div', 'prog'), bar = el('i'); prog.appendChild(bar); head.appendChild(prog);
      app.appendChild(head);
      var main = el('main'); app.appendChild(main);
      var foot = el('div', 'bar'), send = el('button', '', ''), note = el('small', '', '다 못 골라도 보낼 수 있어요 · 같은 링크로 다시 들어와 고칠 수 있어요');
      send.type = 'button'; foot.appendChild(send); foot.appendChild(note); app.appendChild(foot);
      function sync() {
        var n = answered(), all = data.items.length;
        bar.style.width = (all ? Math.round(n / all * 100) : 0) + '%';
        send.textContent = '보내기 (' + n + '/' + all + ' 답함)';
        send.disabled = !n;
        [].forEach.call(main.children, function (card, i) { card.classList.toggle('done', !!String(ans[data.items[i].id] || '').trim()); });
      }
      data.items.forEach(function (q, idx) {
        var card = el('div', 'q');
        var qt = el('div', 'qt'); qt.appendChild(el('span', '', String(idx + 1))); qt.appendChild(document.createTextNode(q.label)); card.appendChild(qt);
        var input = null;
        if (q.type === 'pw') {
          input = el('input', 'box pw'); input.type = 'text'; input.inputMode = 'text'; input.autocomplete = 'off'; input.placeholder = '비번 (예: 1234#)';
          card.appendChild(input);
        }
        var chips = el('div', 'chips');
        var free = null;
        (q.opts || []).forEach(function (o) {
          var c = el('button', 'chip' + (ans[q.id] === o ? ' on' : ''), o); c.type = 'button';
          c.onclick = function () {
            ans[q.id] = ans[q.id] === o ? '' : o;
            [].forEach.call(chips.querySelectorAll('.chip'), function (x) { x.classList.toggle('on', x.textContent === ans[q.id]); });
            if (input) input.value = '';
            if (free) { free.value = ''; free.hidden = true; }
            sync();
          };
          chips.appendChild(c);
        });
        if (q.type === 'choice' && q.free) {
          var etc = el('button', 'chip etc', '직접 쓰기'); etc.type = 'button';
          etc.onclick = function () { free.hidden = false; free.focus(); };
          chips.appendChild(etc);
        }
        if ((q.opts || []).length || q.type === 'choice') card.appendChild(chips);
        if (q.type === 'text' || (q.type === 'choice' && q.free)) {
          free = el(q.type === 'text' ? 'textarea' : 'input', 'box'); free.placeholder = q.type === 'text' ? '적어 주세요' : '직접 적어 주세요';
          if (q.type === 'text') free.rows = 3; else free.type = 'text';
          free.hidden = q.type !== 'text';
          card.appendChild(free);
          input = input || free;
        }
        if (input) input.addEventListener('input', function () {
          ans[q.id] = input.value;
          [].forEach.call(chips.querySelectorAll('.chip'), function (x) { x.classList.remove('on'); });
          sync();
        });
        if (q.sent) card.appendChild(el('div', 'sent', '✔ 이미 보냄 — 바뀌었으면 다시 골라 주세요'));
        main.appendChild(card);
      });
      send.onclick = function () {
        send.disabled = true; send.textContent = '보내는 중…';
        var body = {};
        data.items.forEach(function (q) { var v = String(ans[q.id] || '').trim(); if (v) body[q.id] = v.slice(0, 300); });
        fetch(API, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ k: key, answers: body }) })
          .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
          .then(function (d) {
            if (!d.ok) throw new Error(d.error || '못 보냄');
            var m = msg('🙏', '고맙습니다!', (data.company || '시공팀') + '에 바로 전달됐어요');
            var sum = el('div', 'sum');
            data.items.forEach(function (q) {
              var v = body[q.id]; if (!v) return;
              var r = el('div'); r.appendChild(el('span', '', q.label.length > 14 ? q.label.slice(0, 14) + '…' : q.label));
              r.appendChild(el('b', '', q.type === 'pw' && !/없음|당일/.test(v) ? v.replace(/./g, '●') : v)); sum.appendChild(r);
            });
            m.appendChild(sum);
            var again = el('button', 'again', '다시 고치기'); again.type = 'button'; again.onclick = function () { load(); };
            m.appendChild(again);
          })
          .catch(function (e) { send.disabled = false; sync(); alert('못 보냈어요 — 잠시 뒤 다시 눌러 주세요 (' + String(e.message || e).slice(0, 40) + ')'); });
      };
      sync();
    }
    function load() {
      ans = {};
      fetch(API + '?k=' + encodeURIComponent(key))
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function (d) {
          if (!d.ok) { msg('🔒', d.closed ? '이 질문은 닫혔어요' : '질문을 찾을 수 없어요', d.closed ? '시공이 끝났거나 2주가 지났어요. 궁금한 건 카톡으로 말씀해 주세요' : '카톡으로 받은 링크를 그대로 눌러 주세요'); return; }
          if (!(d.items || []).length) { msg('✅', '더 여쭤볼 게 없어요', '모두 받았어요. 고맙습니다!'); return; }
          data = d; render();
        })
        .catch(function () { msg('📶', '불러오지 못했어요', '인터넷을 확인하고 새로고침해 주세요'); });
    }
    load();
  })();
  </script>
</body>
</html>
